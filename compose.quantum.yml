services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sentinel
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: packages/apps/api/Dockerfile
    environment:
      PORT: 8080
      LOG_LEVEL: info
      LOG_PRETTY: "false"
      DATABASE_URL: postgres://sentinel:${POSTGRES_PASSWORD}@postgres:5432/sentinel
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${WEB_URL}
      WEB_URL: ${WEB_URL}
      UPSTREAM_FIRST_BYTE_TIMEOUT_MS: ${UPSTREAM_FIRST_BYTE_TIMEOUT_MS:-120000}
    ports:
      - "8080"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: packages/apps/web/Dockerfile
      args:
        VITE_API_URL: ${API_URL}
    ports:
      - "80"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
